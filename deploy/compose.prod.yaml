name: maomao-youshu

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - max_connections=30
    shm_size: 128mb
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    networks:
      - backend

  migrate:
    image: ${API_IMAGE:?API_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: "no"
    environment: &api-environment
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portfolio}?schema=public
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-https://invalid.local}
      INGEST_SHARED_SECRET: ${INGEST_SHARED_SECRET:?INGEST_SHARED_SECRET is required}
      INDUSTRY_PROVIDER: ${INDUSTRY_PROVIDER:-eastmoney}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TUSHARE_API_URL: ${TUSHARE_API_URL:-}
    command:
      - pnpm
      - --filter
      - "@portfolio/api"
      - db:deploy
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    image: ${API_IMAGE:?API_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    init: true
    environment: *api-environment
    ports:
      - 127.0.0.1:8787:4000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    networks:
      - backend

volumes:
  postgres-data:

networks:
  backend:

