server {
    listen 80;
    server_name 60.205.90.12;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location = /maomao-api {
        return 308 https://$host/maomao-api/;
    }

    location /maomao-api/ {
        return 308 https://$host$request_uri;
    }

    client_max_body_size 20M;

    access_log /var/log/nginx/frontend_access.log;
    error_log /var/log/nginx/frontend_error.log;
}

server {
    listen 443 ssl http2;
    server_name 60.205.90.12;

    ssl_certificate /etc/letsencrypt/live/60.205.90.12/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/60.205.90.12/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location /maomao-api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }

    client_max_body_size 20M;

    access_log /var/log/nginx/maomao_api_access.log;
    error_log /var/log/nginx/maomao_api_error.log;
}
